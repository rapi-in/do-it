<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Do-it</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3A8571">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F7F4;--card:#fff;--ink:#22404A;--mut:#5E767E;--pri:#3A8571;--onpri:#fff;--soft:#DDF0E8;--lav:#E8E9FA;--peach:#FDEBDD;--coral:#D9695A;--amber:#D9A02E;--line:#E0EAE6;--gap:64px;--sky:#DCEBF5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15221E;--card:#1F312B;--ink:#E6F1EE;--mut:#A3BAB2;--pri:#6CC1A9;--onpri:#0F1F1A;--soft:#284339;--lav:#2A2D4A;--peach:#3F3027;--coral:#EE8D7F;--amber:#E9B84F;--line:#2C433B;--sky:#26394A}}
:root[data-theme="dark"]{--bg:#15221E;--card:#1F312B;--ink:#E6F1EE;--mut:#A3BAB2;--pri:#6CC1A9;--onpri:#0F1F1A;--soft:#284339;--lav:#2A2D4A;--peach:#3F3027;--coral:#EE8D7F;--amber:#E9B84F;--line:#2C433B;--sky:#26394A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45}
#v{padding:14px 14px 170px;max-width:560px;margin:0 auto}
h1{font-size:22px;margin:4px 0 2px;font-weight:800}
h2{font-size:18px;margin:20px 0 8px;font-weight:800}
h3{margin:0 0 10px;font-size:18px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border-radius:20px;padding:14px;margin:10px 0;border:1px solid var(--line)}
.hero{background:var(--soft);border-radius:24px;overflow:hidden;margin:6px 0 10px}
.hero svg{display:block;width:100%;height:auto}
.hero .t{padding:4px 16px 16px}
.big{font-size:30px;font-weight:800;letter-spacing:-.5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:18px;padding:12px}
.tile b{display:block;font-size:17px}
.inv{background:var(--sky)}.in{background:var(--soft)}.out{background:var(--peach)}.bal{background:var(--lav)}
.row{display:flex;gap:10px;align-items:center}
.sp{justify-content:space-between}
.ico{width:42px;height:42px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:22px;flex:none}
.grow{flex:1;min-width:0}
.it{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.it:last-child{border:0}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--pri)}
.chip{font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--soft);white-space:nowrap}
.chip.w{background:var(--peach)}.chip.r{background:var(--coral);color:#fff}
.btn{border:0;background:var(--pri);color:var(--onpri);font:inherit;font-weight:800;padding:11px 18px;border-radius:14px;min-height:44px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{padding:6px 14px;min-height:36px;font-size:14px}
.x{border:0;background:none;color:var(--mut);font:inherit;font-size:13px;padding:8px}
.add{width:100%;margin:6px 0}
.fab{position:fixed;right:16px;bottom:calc(150px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;font-size:30px;padding:0;box-shadow:0 6px 18px rgba(34,64,74,.25);z-index:5}
nav{position:fixed;left:0;right:0;bottom:calc(var(--gap) + env(safe-area-inset-bottom,0px));display:flex;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(34,64,74,.08);padding:6px 4px;z-index:6}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:calc(var(--gap) + env(safe-area-inset-bottom,0px));background:var(--bg);z-index:5}
nav button{flex:1;border:0;background:none;font:inherit;font-size:11px;font-weight:700;color:var(--mut);padding:4px 0;border-radius:12px}
nav button span{display:block;font-size:21px}
nav button.on{color:var(--ink);background:var(--soft)}
#modal{position:fixed;inset:0;background:rgba(20,40,40,.45);display:none;align-items:flex-end;z-index:20}
#modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + var(--gap) + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
label{display:block;font-weight:700;font-size:14px;margin-bottom:10px}
input,select,textarea{width:100%;margin-top:4px;font:inherit;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.sheet .row .btn{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.on{opacity:1}
.mn{display:flex;align-items:center;justify-content:space-between;margin:6px 0}
.mn button{border:0;background:var(--soft);color:var(--ink);border-radius:12px;width:44px;height:44px;font-size:20px}
.mn .mlab{flex:1;width:auto;margin:0 8px;font-size:17px;font-weight:800;background:var(--card);border:1px solid var(--line)}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin:6px 0}.seg button{flex:1;border:0;background:none;font:inherit;font-weight:800;padding:9px;border-radius:11px;color:var(--mut);min-height:40px}.seg button.on{background:var(--card);color:var(--ink)}
.cht{display:flex;gap:8px;align-items:flex-end;height:110px}
.cht div{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.cht span{display:flex;gap:2px;align-items:flex-end;justify-content:center;height:90px}
.cht i{width:10px;border-radius:5px 5px 0 0;display:block}
.emp{text-align:center;padding:18px;color:var(--mut)}
.emp div{font-size:40px}

/* tampilan lebih segar */
:root{--sh:0 6px 22px rgba(34,64,74,.08);--sh2:0 10px 28px rgba(34,64,74,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sh:0 6px 22px rgba(0,0,0,.28);--sh2:0 10px 28px rgba(0,0,0,.4)}}
html,body{font-weight:500;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1{font-size:25px;letter-spacing:-.4px;margin:6px 0 2px}
h2{display:flex;align-items:center;gap:9px;font-size:18px;letter-spacing:-.2px;margin:24px 0 10px}
h2::before{content:"";width:5px;height:20px;border-radius:4px;background:linear-gradient(180deg,var(--pri),#7CC3AE)}
.mut{font-weight:600}
.card{border:0;box-shadow:var(--sh);border-radius:24px;padding:16px}
.hero{background:var(--soft);box-shadow:var(--sh2);border-radius:28px}
.hero .t{padding:6px 18px 18px}
.hero .t .mut{font-size:12.5px;letter-spacing:.5px;text-transform:uppercase;font-weight:800}
.big{font-size:34px;letter-spacing:-1px}
.tile{border-radius:22px;padding:14px;box-shadow:var(--sh)}
.tile .mut{font-size:13px;font-weight:700}
.tile b{font-size:19px;letter-spacing:-.3px;margin-top:2px}
.in{background:linear-gradient(135deg,var(--soft),color-mix(in srgb,var(--soft) 55%,var(--card)))}
.out{background:linear-gradient(135deg,var(--peach),color-mix(in srgb,var(--peach) 55%,var(--card)))}
.bal{background:linear-gradient(135deg,var(--lav),color-mix(in srgb,var(--lav) 55%,var(--card)))}
.inv{background:linear-gradient(135deg,var(--sky),color-mix(in srgb,var(--sky) 55%,var(--card)))}
.ico{width:46px;height:46px;border-radius:16px;font-size:23px}
.it{padding:12px 0}
.chip{font-weight:800;padding:4px 11px}
.btn{background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 72%,#7CC3AE));box-shadow:0 6px 14px rgba(58,133,113,.28);border-radius:16px;transition:transform .12s}
.btn.ghost{background:var(--soft);box-shadow:none}
.btn:active{transform:scale(.97)}
.fab{border-radius:22px;box-shadow:var(--sh2)}
.bar{height:12px;border-radius:10px}
.bar i{background:linear-gradient(90deg,var(--pri),#7CC3AE);transition:width .5s}
nav{left:10px;right:10px;border:0;border-radius:24px;box-shadow:0 10px 30px rgba(34,64,74,.18);padding:6px}
nav button{border-radius:18px;transition:background .2s,color .2s}
nav button span{transition:transform .2s}
nav button.on{background:var(--soft);color:var(--ink)}
nav button.on span{transform:translateY(-2px) scale(1.12)}
input,select,textarea{border-radius:14px;font-weight:600}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:1px}
.sheet{border-radius:28px 28px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.2);animation:slideup .25s ease}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.mn .mlab{border-radius:16px;box-shadow:var(--sh)}
.mn button{border-radius:16px}
.emp div{font-size:46px}
@keyframes slideup{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#v>*{animation:rise .35s ease both}
#v>*:nth-child(2){animation-delay:.04s}#v>*:nth-child(3){animation-delay:.08s}#v>*:nth-child(4){animation-delay:.12s}#v>*:nth-child(5){animation-delay:.16s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
nav button{font-size:9.5px;letter-spacing:-.1px;min-width:0;padding:4px 0;overflow:hidden;text-overflow:clip}
nav button.plus{flex:none;align-self:flex-start;width:52px;height:52px;margin:-26px 2px 0;padding:0;border-radius:20px;font-size:32px;line-height:1;color:var(--onpri);background:linear-gradient(135deg,var(--pri),#7CC3AE);box-shadow:0 8px 18px rgba(58,133,113,.4)}
nav button.plus:active{transform:scale(.94)}
#v{padding-bottom:150px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}.g3 div{background:var(--bg);border-radius:14px;padding:8px 4px;text-align:center}.g3 span{display:block;font-size:11px;color:var(--mut);font-weight:700}.g3 b{font-size:12.5px;letter-spacing:-.3px;white-space:nowrap}
.lt{font-weight:700;font-size:14px;margin-bottom:6px}.ig{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:190px;overflow:auto;padding:2px}.ib{border:2px solid transparent;background:var(--bg);border-radius:14px;font-size:24px;padding:4px 0;min-height:46px}.ib.on{border-color:var(--pri);background:var(--soft)}
#welcome{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:linear-gradient(180deg,var(--sky),var(--soft) 55%,var(--bg));transition:opacity .5s}
#welcome.out{opacity:0;pointer-events:none}
#welcome .wc{display:flex;flex-direction:column;align-items:center;max-width:380px;width:100%}
#welcome .wsvg{width:100%;border-radius:28px;overflow:hidden;box-shadow:var(--sh2);animation:bob 3s ease-in-out infinite}
#welcome .wsvg svg{display:block;width:100%;height:auto}
#welcome h1{font-size:28px;line-height:1.2;margin:26px 0 8px;letter-spacing:-.5px;animation:rise .6s ease .15s both}
#welcome p{margin:0 0 22px;font-size:16.5px;font-weight:600;color:var(--mut);animation:rise .6s ease .3s both}
#welcome .btn{min-width:150px;animation:rise .6s ease .45s both}
#welcome .by{position:absolute;right:20px;bottom:calc(var(--gap) + 14px + env(safe-area-inset-bottom,0px));font-family:'Pacifico','Brush Script MT','Segoe Script',cursive;font-size:15px;color:var(--mut);animation:rise .6s ease .6s both}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.hero .q{padding:18px 22px 12px;text-align:center;font-size:16px;font-weight:800;line-height:1.4;letter-spacing:-.2px;text-wrap:balance}
.hl{color:var(--pri)}
.chick{display:flex;gap:12px;align-items:flex-end;margin:12px 0}
.chick .cav{flex:none;width:64px;height:64px;border-radius:22px;background:var(--soft);display:grid;place-items:center;box-shadow:var(--sh)}
.chick .cav svg{width:56px;height:56px}
.chick .cb{position:relative;flex:1;min-width:0;background:var(--card);border:2px solid var(--pri);border-radius:20px 20px 20px 6px;padding:11px 14px;font-size:14.5px;font-weight:600;line-height:1.4;box-shadow:var(--sh)}
.chick .cb>b:first-child{display:block;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.chick .cb::before{content:"";position:absolute;left:-8px;bottom:14px;width:12px;height:12px;background:var(--card);border-left:2px solid var(--pri);border-bottom:2px solid var(--pri);transform:rotate(45deg)}
.chick.bad .cb{border-color:var(--coral)}.chick.bad .cb::before{border-color:var(--coral)}
.chick.warn .cb{border-color:var(--amber)}.chick.warn .cb::before{border-color:var(--amber)}
#cpop{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));max-width:536px;margin:0 auto;z-index:40;transform:translateY(-160%);transition:transform .4s cubic-bezier(.2,.9,.3,1.2);pointer-events:none}
#cpop.on{transform:none;pointer-events:auto}
#cpop .cb{box-shadow:var(--sh2)}
.mn .mlab.rgl{font-size:14px;line-height:1.25;padding:4px 8px}
.chh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.chh b{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
.chick.ok .cb{border-color:var(--pri)}
#cmini{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:52px;height:52px;border-radius:18px;border:0;background:var(--soft);box-shadow:var(--sh2);z-index:39;display:none;padding:4px}
#cmini.on{display:block}
#cmini svg{width:100%;height:100%}
</style>
</head>
<body>
<div id="v"></div>
<nav id="nav"></nav>
<div id="modal"></div>
<div id="toast"></div>
<div id="cpop" onclick="hidePop()"></div>
<button id="cmini" onclick="showPop(false)" aria-label="Buka asisten ayam"></button>
<div id="welcome" onclick="closeW()"></div>
<script>
const $=s=>document.querySelector(s);
const rp=n=>'Rp '+new Intl.NumberFormat('id-ID').format(Math.round(n||0));
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tgl=d=>new Date(d+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short'});
const bln=m=>new Date(m+'-01T00:00').toLocaleDateString('id-ID',{month:'long',year:'numeric'});
const SAV=['Tabungan umum','Dana darurat','Tabungan pendidikan'],INV=['Emas','Reksa dana','Saham','Deposito'];
const EXP=['Dapur','Transportasi','Pendidikan','Kesehatan','Hiburan','Cicilan','Tagihan','Lainnya'],INC=['Gaji','Usaha','Pemasukan lain'];
const IC={Dapur:'🛒',Transportasi:'🚌',Pendidikan:'📚',Kesehatan:'💊',Hiburan:'🎬',Cicilan:'🏍️',Tagihan:'💡',Lainnya:'🧺',Gaji:'💼',Usaha:'🏪','Pemasukan lain':'🎁','Tabungan umum':'🐔','Dana darurat':'🛟','Tabungan pendidikan':'🎓',Emas:'🪙','Reksa dana':'📈',Saham:'📊',Deposito:'🏦'};
const AI={'Tunai':'💵','Rekening bank':'🏦','E-wallet':'📱'};
const BR={bca:['BCA','Rekening bank','#0060AF','#fff','BCA'],bri:['BRI','Rekening bank','#00529C','#F7A41D','BRI'],seabank:['SeaBank','Rekening bank','#F26522','#fff','Sea'],superbank:['Superbank','Rekening bank','#FF5A2C','#fff','Super'],gopay:['GoPay','E-wallet','#00AED6','#fff','GoPay'],shopeepay:['ShopeePay','E-wallet','#EE4D2D','#fff','Shopee'],ovo:['OVO','E-wallet','#4C2A86','#fff','OVO']};
const lg=a=>{const b=BR[a.k];return b?`<div class="ico" style="background:${b[2]};color:${b[3]};font-size:${b[4].length>4?10:13}px;font-weight:800">${b[4]}</div>`:`<div class="ico">${AI[a.t]||'💳'}</div>`};
const BASE={exp:[...EXP],sav:[...SAV],inv:[...INV],inc:[...INC]};
const GN={exp:'Pengeluaran',sav:'Tabungan',inv:'Investasi',inc:'Pemasukan'};
const ICONS=['🛒','🍚','🍜','☕','🍔','🥦','🛍️','👕','👟','🧴','🧼','💊','🏥','🩺','🚌','🚗','🏍️','⛽','🚆','✈️','📚','🎓','🎒','✏️','💡','💧','📶','📱','🏠','🛠️','🧺','🧸','👶','🍼','🎬','🎮','🎵','⚽','🏋️','🎁','🎂','🙏','🕌','🐱','🐕','🌱','💰','📈','🪙','🏦','💼','🏪','🧾','🏷️'];
function applyCats(){S.tf=S.tf||[];S.cats=S.cats||{};Object.keys(BASE).forEach(k=>{S.cats[k]=S.cats[k]||[]});[['exp',EXP],['sav',SAV],['inv',INV],['inc',INC]].forEach(([k,arr])=>{arr.length=0;arr.push(...BASE[k]);S.cats[k].forEach(c=>{arr.push(c.n);IC[c.n]=c.i})})}
const KEY='kas-keluarga-v1';
let S,tab='home',cur=today().slice(0,7),ym=cur,rg=null;
function demo(){const m=cur,b=uid(),t=uid(),e=uid();return{
acc:[{id:t,n:'Dompet',t:'Tunai',o:1000000},{id:b,n:'Bank utama',t:'Rekening bank',o:4000000},{id:e,n:'GoPay',t:'E-wallet',o:500000}],
tx:[['Gaji',8000000,b,'01','Gaji bulanan'],['Usaha',1500000,b,'03','Jualan online'],['Dapur',750000,b,'04','Belanja bulanan'],['Dapur',420000,t,'09','Pasar'],['Transportasi',300000,e,'08','Bensin & ojek'],['Pendidikan',600000,b,'10','SPP'],['Hiburan',150000,e,'12','Nonton'],['Kesehatan',120000,t,'13','Obat']].map(x=>({id:uid(),c:x[0],a:x[1],ac:x[2],d:m+'-'+x[3],n:x[4]})),
bills:[{id:uid(),k:'cicilan',n:'Cicilan motor',amt:1250000,day:15,sisa:10,tenor:1,paid:[]},{id:uid(),k:'tagihan',n:'Listrik',amt:350000,day:20,paid:[]},{id:uid(),k:'tagihan',n:'Internet',amt:400000,day:5,paid:[m]},{id:uid(),k:'tagihan',n:'SPP anak',amt:600000,day:10,paid:[m]}],
goals:[{id:uid(),i:'🛟',n:'Dana darurat',target:30000000,saved:12500000},{id:uid(),i:'🎓',n:'Biaya pendidikan',target:25000000,saved:8000000},{id:uid(),i:'✈️',n:'Liburan keluarga',target:8000000,saved:2100000}],
bud:{Dapur:2500000,Transportasi:800000,Pendidikan:1000000,Kesehatan:400000,Hiburan:500000}}}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S)S=demo();
S.acc.forEach(a=>{if(!a.k){const k=Object.keys(BR).find(x=>a.n.toLowerCase().includes(x));if(k)a.k=k}});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const isInc=c=>INC.includes(c);
const inP=(d,m)=>{const i=m.indexOf('..');return i>0?d>=m.slice(0,i)&&d<=m.slice(i+2):d.startsWith(m)};
const per=()=>rg?rg.a+'..'+rg.b:ym;
const upTo=()=>rg?rg.b:ym;
const le=(d,u)=>u.length==7?d.slice(0,7)<=u:d<=u;
const defDate=()=>inP(today(),per())?today():(rg?rg.a:ym+'-01');
const mtx=m=>S.tx.filter(t=>inP(t.d,m)).sort((a,b)=>b.d.localeCompare(a.d));
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const sg=t=>isInc(t.c)?t.a:-t.a;
const accTx=(id,upto)=>S.tx.filter(t=>t.ac==id&&(!upto||le(t.d,upto)));

const togR=id=>{rop[id]=!rop[id];render()};
const aIO=(id,m)=>{const l=S.tx.filter(t=>t.ac==id&&inP(t.d,m)).sort((a,b)=>b.d.localeCompare(a.d));const f=(S.tf||[]).filter(t=>(t.from==id||t.to==id)&&inP(t.d,m));return{l,f,i:sum(l.filter(t=>isInc(t.c)),t=>t.a),o:sum(l.filter(t=>!isInc(t.c)),t=>t.a),pi:sum(f.filter(t=>t.to==id),t=>t.a),po:sum(f.filter(t=>t.from==id),t=>t.a)}};
const aBal=a=>{const u=upTo(),l=accTx(a.id,u),tf=(S.tf||[]).filter(t=>le(t.d,u)),ti=sum(l.filter(t=>isInc(t.c)),t=>t.a),tk=sum(l.filter(t=>!isInc(t.c)),t=>t.a),ci=ti+sum(tf.filter(t=>t.to==a.id),t=>t.a),co=tk+sum(tf.filter(t=>t.from==a.id),t=>t.a);return{o:a.o||0,ti,to:tk,ci,co,t:(a.o||0)+ci-co}};
function editAcc(id){const a=S.acc.find(x=>x.id==id);form('Edit rekening',[{k:'n',l:'Nama',v:a.n},{k:'b',l:'Saldo awal (Rp)',t:'number',v:a.o||0}],v=>{if(!v.n){toast('Isi nama rekening');return false}a.n=v.n;a.o=v.b||0;toast('Rekening diubah')})}
const accCard=a=>{const b=aBal(a),x=aIO(a.id,per()),op=rop[a.id];
return `<div class="card"><div class="row">${lg(a)}<div class="grow"><b>${esc(a.n)}</b><div class="mut">${a.t}</div></div></div>
<div class="g3"><div><span>Saldo awal</span><b>${rp(b.o)}</b></div><div><span>Saldo pemasukan</span><b>${rp(b.ci)}</b></div><div><span>Total saldo</span><b>${rp(b.t)}</b></div></div><div class="mut" style="margin-top:6px;font-size:12.5px">Total keluar sampai periode ini ${rp(b.co)}. Total saldo = saldo awal + total masuk − total keluar.</div>
<div class="row sp" style="margin-top:10px"><span class="chip">Masuk ${rp(x.i+x.pi)}</span><span class="chip w">Keluar ${rp(x.o+x.po)}</span></div>${x.pi||x.po?`<div class="mut" style="margin-top:8px">🔁 Sudah termasuk pindah dana periode ini: masuk ${rp(x.pi)} · keluar ${rp(x.po)}</div>`:''}
<div class="row sp" style="margin-top:6px"><span><button class="x" onclick="editAcc('${a.id}')">edit</button><button class="x" onclick="delAcc('${a.id}')">hapus</button></span><button class="btn sm ghost" onclick="togR('${a.id}')">${op?'Tutup rincian':'Rincian ('+(x.l.length+x.f.length)+')'}</button></div>
${op?`<div style="margin-top:6px">${x.l.length+x.f.length?[...x.l.map(t=>({d:t.d,h:txRow(t)})),...x.f.map(t=>({d:t.d,h:trRow(t,a.id)}))].sort((p,q)=>q.d.localeCompare(p.d)).map(z=>z.h).join(''):'<div class="mut" style="padding:10px 0">Tidak ada transaksi di bulan ini</div>'}</div>`:''}</div>`};
function rek(){const bs=S.acc.map(aBal),aw=sum(bs,x=>x.o),tt=sum(bs,x=>x.t),mt=sum(bs,x=>x.ti),mk=sum(bs,x=>x.to),io=S.acc.map(a=>aIO(a.id,per())),mi=sum(io,x=>x.i),mo=sum(io,x=>x.o),ts=[...new Set([...Object.keys(AI),...S.acc.map(a=>a.t)])];
return `<h1>Rekening</h1>${mbar()}
<div class="grid"><div class="tile bal"><span class="mut">Saldo awal</span><b>${rp(aw)}</b></div><div class="tile inv"><span class="mut">Saldo pemasukan</span><b>${rp(mt)}</b></div></div>
<div class="tile in" style="margin-top:10px"><span class="mut">Total saldo</span><div class="big">${rp(tt)}</div></div>
<div class="grid" style="margin-top:10px"><div class="tile in"><span class="mut">Masuk ${rg?'periode':'bulan'} ini</span><b>${rp(mi)}</b></div><div class="tile out"><span class="mut">Keluar ${rg?'periode':'bulan'} ini</span><b>${rp(mo)}</b></div></div>
<div class="mut" style="margin-top:8px">Saldo awal adalah saldo saat rekening dibuat. Saldo pemasukan adalah total uang yang masuk sampai akhir periode yang dipilih. Total saldo = saldo awal + total masuk − total keluar (total keluar seluruh rekening ${rp(mk)}). Angka ringkasan di atas dan per kelompok tidak menghitung pindah dana, sedangkan di tiap rekening pindah dana tetap dihitung sebagai masuk atau keluar rekening itu.</div>
${S.acc.length?ts.map(t=>{const as=S.acc.filter(a=>a.t==t);if(!as.length)return '';const g=as.map(a=>aIO(a.id,per()));return `<h2>${AI[t]||'💳'} ${t}</h2><div class="mut" style="margin:-4px 0 6px">Total ${rp(sum(as,a=>aBal(a).t))} · Masuk ${rp(sum(g,x=>x.i))} · Keluar ${rp(sum(g,x=>x.o))}</div>${as.map(accCard).join('')}`}).join(''):`<div class="card">${empty('👛','Belum ada rekening')}</div>`}
<button class="btn add ghost" onclick="trForm()">🔁 Pindah dana antar rekening</button>
<button class="btn add" onclick="addAcc()">+ Tambah rekening</button>`}
function bill(){const l=[...S.bills].sort((a,b)=>(a.done?1:0)-(b.done?1:0)||a.day-b.day),due=sum(l.filter(b=>!b.done&&!b.paid.includes(ym)),b=>b.amt);
return `<h1>Cicilan & tagihan</h1>${mbar()}<div class="mut">${rg?'Tagihan mengikuti bulan '+bln(ym)+' (bulan dari tanggal akhir periode)':'Belum dibayar di bulan ini'}</div><div class="tile out" style="margin:10px 0"><div class="big">${rp(due)}</div></div>
${l.length?l.map(b=>{const s=st(b,ym),ok=b.done||b.paid.includes(ym);return `<div class="card"><div class="row"><div class="ico">${b.k=='cicilan'?'🏍️':'💡'}</div><div class="grow"><b>${esc(b.n)}</b><div class="mut">${rp(b.amt)} · jatuh tempo tgl ${b.day}${b.tenor&&!b.done?' · sisa '+b.sisa+' bulan':''}</div></div><span class="chip ${s.c}">${s.t}</span></div><div class="row sp" style="margin-top:8px"><button class="x" onclick="delBill('${b.id}')">hapus</button>${ok?'<span class="mut">✔ Tercatat</span>':`<button class="btn sm" onclick="payBill('${b.id}')">Bayar sekarang</button>`}</div></div>`}).join(''):`<div class="card">${empty('🧾','Belum ada tagihan')}</div>`}
<button class="btn add" onclick="addBill()">+ Tambah cicilan / tagihan</button>`}
function goal(){return `<h1>Target tabungan</h1><div class="mut">Wujudkan impian keluarga</div>
${S.goals.length?S.goals.map(g=>{const p=Math.min(100,g.saved/g.target*100);return `<div class="card"><div class="row"><div class="ico" style="background:var(--lav)">${g.i}</div><div class="grow"><b>${esc(g.n)}</b><div class="mut">${rp(g.saved)} dari ${rp(g.target)}</div></div><b>${Math.round(p)}%</b></div>${bar(p)}<div class="mut" style="margin-top:6px">${p>=100?'🎉 Target tercapai!':'Kurang '+rp(g.target-g.saved)}</div><div class="row sp" style="margin-top:6px"><button class="x" onclick="delGoal('${g.id}')">hapus</button><button class="btn sm" onclick="fundGoal('${g.id}')">+ Tabung</button></div></div>`}).join(''):`<div class="card">${empty('🎯','Belum ada target')}</div>`}
<button class="btn add" onclick="addGoal()">+ Target baru</button>`}
function ang(){const ks=Object.keys(S.bud),lim=sum(ks,c=>S.bud[c]),sp=sum(ks,c=>spent(per(),c));
return `<h1>Anggaran</h1>${mbar()}${rg?'<div class="mut" style="margin:4px 0">Periode tanggal sendiri: pengeluaran dalam periode dibandingkan dengan batas anggaran penuh.</div>':''}<div class="tile bal" style="margin:10px 0"><span class="mut">Terpakai ${rp(sp)} dari ${rp(lim)}</span>${bar(lim?sp/lim*100:0,bcol(lim?sp/lim*100:0))}</div>
${ks.length?ks.map(c=>{const s=spent(per(),c),p=s/S.bud[c]*100;return `<div class="card"><div class="row"><div class="ico">${IC[c]}</div><div class="grow"><b>${c}</b><div class="mut">${rp(s)} dari ${rp(S.bud[c])}</div></div><b style="color:${bcol(p)}">${Math.round(p)}%</b></div>${bar(p,bcol(p))}<div class="row sp" style="margin-top:6px"><button class="x" onclick="delBud('${c}')">hapus</button><span class="mut">${p>=100?'Melebihi '+rp(s-S.bud[c]):'Sisa '+rp(S.bud[c]-s)}</span></div></div>`}).join(''):`<div class="card">${empty('📊','Belum ada anggaran')}</div>`}
<button class="btn add" onclick="setBud()">+ Atur anggaran kategori</button>${catMgr()}`}
const shift=(m,n)=>{const d=new Date(m+'-01T00:00');d.setMonth(d.getMonth()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
let rv='m';
const yv=n=>{ym=shift(ym,n*12);rg=null;render()};
const tiles2=f=>`<div class="grid" style="margin-top:10px"><div class="tile bal"><span class="mut">🐔 Tabungan</span><b>${rp(f.t)}</b></div><div class="tile inv"><span class="mut">📈 Investasi</span><b>${rp(f.v)}</b></div></div>
<div class="tile in" style="margin-top:10px"><span class="mut">Sisa (masuk − keluar − tabungan − investasi)</span><b>${rp(f.i-f.o-f.t-f.v)}</b></div>`;
const chart=(ms,fl,mx)=>`<div class="card"><div class="cht">${ms.map((m,i)=>`<div><span><i style="height:${fl[i].i/mx*100}%;background:var(--pri)"></i><i style="height:${fl[i].o/mx*100}%;background:var(--coral)"></i></span>${bln(m).slice(0,3)}</div>`).join('')}</div><div class="mut" style="margin-top:8px">🟩 Pemasukan &nbsp; 🟥 Pengeluaran</div></div>`;
const catCard=(cs,tot)=>`<div class="card">${cs.length?cs.map(x=>`<div style="margin:8px 0"><div class="row sp"><b>${IC[x[0]]} ${x[0]}</b><span>${rp(x[1])}</span></div>${bar(x[1]/tot*100)}</div>`).join(''):empty('📒','Belum ada pengeluaran')}</div>`;
const tiCard=m=>`<div class="card">${[...SAV,...INV].map(c=>[c,spent(m,c)]).filter(x=>x[1]>0).map(x=>`<div class="it"><div class="ico">${IC[x[0]]}</div><div class="grow"><b>${x[0]}</b><div class="mut">${SAV.includes(x[0])?'Tabungan':'Investasi'}</div></div><b>${rp(x[1])}</b></div>`).join('')||empty('🐔','Belum ada tabungan atau investasi')}</div>`;
const cats=m=>EXP.map(c=>[c,spent(m,c)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
function repM(){const f=flow(per()),l=mtx(per()),ms=[5,4,3,2,1,0].map(n=>shift(ym,-n)),fl=ms.map(flow),mx=Math.max(1,...fl.map(x=>Math.max(x.i,x.o)));
return `${mbar()}
<div class="grid"><div class="tile in"><span class="mut">Pemasukan</span><b>${rp(f.i)}</b></div><div class="tile out"><span class="mut">Pengeluaran</span><b>${rp(f.o)}</b></div></div>
${tiles2(f)}
${sec('6 bulan terakhir',chart(ms,fl,mx))}
${sec('Pengeluaran per kategori',catCard(cats(per()),f.o))}
${sec('Tabungan & investasi',tiCard(per()))}
${(S.tf||[]).some(t=>inP(t.d,per()))?sec('Pindah dana (tidak dihitung pemasukan/pengeluaran)',`<div class="card">${S.tf.filter(t=>inP(t.d,per())).sort((a,b)=>b.d.localeCompare(a.d)).map(t=>trRow(t)).join('')}</div>`):''}
${sec('Daftar transaksi',`<div class="card">${l.length?l.map(txRow).join(''):empty('📝','Tidak ada transaksi')}</div>`)}`}
function repY(){const Y=ym.slice(0,4),f=flow(Y),ms=MN.map((n,i)=>Y+'-'+String(i+1).padStart(2,'0')),fl=ms.map(flow),mx=Math.max(1,...fl.map(x=>Math.max(x.i,x.o)));
return `<div class="mn"><button onclick="yv(-1)" aria-label="Tahun sebelumnya">‹</button><b>Tahun ${Y}</b><button onclick="yv(1)" aria-label="Tahun berikutnya">›</button></div>
<div class="grid"><div class="tile in"><span class="mut">Pemasukan</span><b>${rp(f.i)}</b></div><div class="tile out"><span class="mut">Pengeluaran</span><b>${rp(f.o)}</b></div></div>
${tiles2(f)}
${sec('Grafik 12 bulan',chart(ms,fl,mx))}
${sec('Per bulan (ketuk untuk membuka)',`<div class="card">${ms.map((m,i)=>{const x=fl[i],sisa=x.i-x.o-x.t-x.v;return `<div class="it" style="cursor:pointer" onclick="ym='${m}';rg=null;rv='m';render();scrollTo(0,0)"><div class="grow"><b>${MN[i]}</b><div class="mut">Masuk ${rp(x.i)} · Keluar ${rp(x.o)}</div><div class="mut">Tabung ${rp(x.t)} · Investasi ${rp(x.v)}</div></div><b style="color:${sisa>=0?'var(--pri)':'var(--coral)'}">${rp(sisa)}</b></div>`}).join('')}</div>`)}
${sec('Pengeluaran per kategori (setahun)',catCard(cats(Y),f.o))}
${sec('Tabungan & investasi (setahun)',tiCard(Y))}`}
function rep(){return `<h1>Laporan keluarga</h1><div class="seg"><button class="${rv=='m'?'on':''}" onclick="rv='m';render()">Bulanan</button><button class="${rv=='y'?'on':''}" onclick="rv='y';render()">Setahun</button></div>${rv=='y'?repY():repM()}`}
const T={home,acc:rek,bill,goal,bud:ang,rep};
const TABS=[['home','🏠','Beranda'],['acc','👛','Rekening'],['bill','🧾','Tagihan'],['goal','🎯','Target'],['bud','📊','Anggaran'],['rep','📒','Laporan']];
$('#nav').innerHTML=TABS.map((t,i)=>(i==3?'<button class="plus" onclick="addTx()" aria-label="Catat transaksi">+</button>':'')+`<button data-t="${t[0]}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('');
function go(t){tab=t;render();window.scrollTo(0,0)}
function render(){$('#v').innerHTML=T[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab))}
$('#modal').addEventListener('click',e=>{if(e.target.id=='modal')closeM()});
render();
function closeW(){const w=$('#welcome');if(!w||w.dataset.x)return;w.dataset.x=1;w.classList.add('out');setTimeout(()=>w.remove(),600)}
$('#welcome').innerHTML=`<div class="wc"><div class="wsvg">${HERO}</div><h1>Selamat Datang di Do-it</h1><p>Satu tempat untuk mengatur keuanganmu</p><button class="btn">Mulai</button></div><div class="by">Created by Teti</div>`;
setTimeout(closeW,3800);
$('#cmini').innerHTML=CHK;
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
